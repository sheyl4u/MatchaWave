<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MatchaWave Cart & Checkout</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5fff7;
    min-height:100vh;
    padding:40px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:40px;
}

.logo{
    font-size:35px;
    font-weight:bold;
    color:#2d6a4f;
}

.logo span{
    color:#95d5b2;
}

.cart-icon{
    position:relative;
    font-size:28px;
    color:#2d6a4f;
}

.badge{
    position:absolute;
    top:-10px;
    right:-10px;
    background:#ff4d6d;
    color:white;
    width:20px;
    height:20px;
    border-radius:50%;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* CONTAINER */

.container{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:30px;
}

/* CART */

.cart-section{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

.title{
    font-size:28px;
    color:#2d6a4f;
    margin-bottom:25px;
}

.cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 0;
    border-bottom:1px solid #eee;
    gap:20px;
}

.item-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.item-left img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:15px;
}

.item-info h3{
    color:#1b4332;
    margin-bottom:5px;
}

.item-info p{
    color:#666;
    font-size:14px;
}

.quantity{
    display:flex;
    align-items:center;
    gap:10px;
}

.quantity button{
    width:30px;
    height:30px;
    border:none;
    background:#d8f3dc;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.quantity button:hover{
    background:#95d5b2;
}

.price{
    font-weight:bold;
    color:#2d6a4f;
    font-size:18px;
    min-width:100px;
    text-align:right;
}

/* CHECKOUT */

.checkout{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.05);
    height:fit-content;
}

.checkout h2{
    color:#2d6a4f;
    margin-bottom:25px;
}

.summary{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    color:#555;
}

.total{
    display:flex;
    justify-content:space-between;
    margin:25px 0;
    font-size:22px;
    font-weight:bold;
    color:#1b4332;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
}

.checkout-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#2d6a4f;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.checkout-btn:hover{
    background:#1b4332;
}

.secure{
    text-align:center;
    margin-top:15px;
    color:#777;
    font-size:13px;
}

/* RESPONSIVE */

@media(max-width:900px){

.container{
    grid-template-columns:1fr;
}

.cart-item{
    flex-direction:column;
    align-items:flex-start;
}

.price{
    text-align:left;
}

}

</style>
</head>
<body>

<!-- HEADER -->

<div class="header">

    <div class="logo">
        Matcha<span>Wave</span>
    </div>

    <div class="cart-icon">
        <i class="fas fa-shopping-cart"></i>
        <div class="badge" id="cart-count">0</div>
    </div>

</div>

<!-- CONTAINER -->

<div class="container">

    <!-- CART -->

    <div class="cart-section">

        <h1 class="title">Your Cart</h1>

        <!-- ITEM 1 -->

        <div class="cart-item" data-price="25000">

            <div class="item-left">

                <img src="https://i.pinimg.com/736x/60/a5/61/60a561a10f3d775c1383394ec94bda64.jpg">

                <div class="item-info">
                    <h3>Matcha Latte</h3>
                    <p>Fresh premium japanese matcha</p>
                </div>

            </div>

            <div class="quantity">

                <button class="minus">-</button>

                <span class="qty">1</span>

                <button class="plus">+</button>

            </div>

            <div class="price">
                Rp 25.000
            </div>

        </div>

        <!-- ITEM 2 -->

        <div class="cart-item" data-price="40000">

            <div class="item-left">

                <img src="https://i.pinimg.com/736x/60/a5/61/60a561a10f3d775c1383394ec94bda64.jpg">

                <div class="item-info">
                    <h3>Matcha Ice Cream</h3>
                    <p>Sweet creamy matcha dessert</p>
                </div>

            </div>

            <div class="quantity">

                <button class="minus">-</button>

                <span class="qty">2</span>

                <button class="plus">+</button>

            </div>

            <div class="price">
                Rp 80.000
            </div>

        </div>

    </div>

    <!-- CHECKOUT -->

    <div class="checkout">

        <h2>Checkout</h2>

        <div class="summary">
            <span>Subtotal</span>
            <span id="subtotal-price">Rp 0</span>
        </div>

        <div class="summary">
            <span>Tax</span>
            <span>Rp 5.000</span>
        </div>

        <div class="summary">
            <span>Delivery</span>
            <span>Rp 10.000</span>
        </div>

        <div class="total">
            <span>Total</span>
            <span id="total-price">Rp 0</span>
        </div>

        <input type="text" placeholder="Full Name">
        <input type="email" placeholder="Email">
        <input type="text" placeholder="Address">

        <button class="checkout-btn" id="pay-button">
    Proceed to Payment
</button>

        <div class="secure">
            Secure checkout • MatchaWave
        </div>

    </div>

</div>

<script>

const minusBtns = document.querySelectorAll('.minus');
const plusBtns = document.querySelectorAll('.plus');

plusBtns.forEach(button => {

    button.addEventListener('click', () => {

        const cartItem = button.closest('.cart-item');

        const quantityElement =
            cartItem.querySelector('.qty');

        let quantity =
            parseInt(quantityElement.innerText);

        quantity++;

        quantityElement.innerText = quantity;

        updateItemPrice(cartItem);
        updateTotal();

    });

});

minusBtns.forEach(button => {

    button.addEventListener('click', () => {

        const cartItem = button.closest('.cart-item');

        const quantityElement =
            cartItem.querySelector('.qty');

        let quantity =
            parseInt(quantityElement.innerText);

        if(quantity > 1){

            quantity--;

            quantityElement.innerText = quantity;

            updateItemPrice(cartItem);
            updateTotal();

        }

    });

});

function updateItemPrice(cartItem){

    const qty =
        parseInt(cartItem.querySelector('.qty').innerText);

    const basePrice =
        parseInt(cartItem.dataset.price);

    const finalPrice = qty * basePrice;

    cartItem.querySelector('.price').innerText =
        'Rp ' + finalPrice.toLocaleString('id-ID');

}

function updateTotal(){

    const items = document.querySelectorAll('.cart-item');

    let subtotal = 0;
    let totalItems = 0;

    items.forEach(item => {

        const qty =
            parseInt(item.querySelector('.qty').innerText);

        const basePrice =
            parseInt(item.dataset.price);

        subtotal += qty * basePrice;

        totalItems += qty;

    });

    const tax = 5000;
    const delivery = 10000;

    const total = subtotal + tax + delivery;

    document.getElementById('subtotal-price').innerText =
        'Rp ' + subtotal.toLocaleString('id-ID');

    document.getElementById('total-price').innerText =
        'Rp ' + total.toLocaleString('id-ID');

    document.getElementById('cart-count').innerText =
        totalItems;

}

updateTotal();
function updateCartCount(){

    const items = document.querySelectorAll('.cart-item');

    let count = 0;

    items.forEach(item => {

        const qty =
            parseInt(item.querySelector('.qty').innerText);

        count += qty;

    });

    document.getElementById('cart-count').innerText = count;

}
updateCartCount();
function updateTotal(){

    const items = document.querySelectorAll('.cart-item');

    let subtotal = 0;

    items.forEach(item => {

        const qty =
            parseInt(item.querySelector('.qty').innerText);

        const price =
            parseInt(item.dataset.price);

        subtotal += qty * price;

    });

    const tax = 5000;
    const delivery = 10000;

    const total = subtotal + tax + delivery;

    document.getElementById('subtotal-price').innerText =
        'Rp ' + subtotal.toLocaleString('id-ID');

    document.getElementById('total-price').innerText =
        'Rp ' + total.toLocaleString('id-ID');

    updateCartCount();

}
</script>
<a href="index.html" class="back-btn">
    <i class="fas fa-arrow-left"></i> Back to Home
</a>

</body>
</html>
