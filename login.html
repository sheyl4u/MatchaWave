<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <form action="proses_login.php" method="POST"></form>

    <style>

        body{
            font-family: Arial;
            background: #dff5e1;

            justify-content: center;

        .login-box{

<div class="login-box">

    <h2>Login</h2>

    <form action="proses_login.php" method="POST">

        placeholder="Username" 
        required>

        <button type="submit">

    </form>
